name: nightly-api-check
# Every night: run the live tests, so a change in Ensembl, ClinVar, UniProt or AlphaFold
# shows up as a failed run (GitHub emails the repository owner) before users hit it.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      # public APIs have occasional hiccups: re-run only the failed tests once before alarming
      - run: pytest -q -m network || (sleep 120 && pytest -q -m network --lf)
