name: installers
# Builds the double-click installers on each system (PyInstaller does not cross-compile), runs the
# packaged app's self-test (it predicts BRAF V600E online and draws the 3D structure), and uploads
# them as artifacts:
#   macOS Apple Silicon and Intel: .dmg     Windows: Setup .exe     Linux: .deb and .tar.gz
# A tag v* also drafts a GitHub release with all of them (publish it by hand after checking).
on:
  push:
    tags: ["v*"]
    branches: ["installers"]
  workflow_dispatch:
jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS Apple Silicon, os: macos-15 }
          - { name: macOS Intel, os: macos-15-intel }
          - { name: Windows, os: windows-2022 }
          - { name: Linux, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Linux libraries for Qt, dpkg tools and a virtual display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dpkg-dev libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libegl1 libgl1 libfontconfig1 libdbus-1-3 libnss3 libxcomposite1 libxdamage1 \
            libxrandr2 libxtst6 libxkbfile1 libasound2
      - name: Install the app and the pinned build tools
        run: python -m pip install ".[gui]" -r packaging/requirements-installer.txt
      - name: Build, package and self-test
        if: runner.os != 'Linux'
        run: python packaging/build.py --installer --smoke --allow-no-3d
      - name: Build, package and self-test (virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1600x1000x24" python packaging/build.py --installer --smoke --allow-no-3d
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: build/installers/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Draft a release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" installers/* --draft
          --title "MissensExplorer ${GITHUB_REF_NAME#v}" --notes-file packaging/INSTALL.txt
