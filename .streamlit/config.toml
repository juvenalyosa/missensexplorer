# Read by Streamlit only when it starts in this folder (Docker, `streamlit run streamlit_app.py`).
# `missensexplorer web` passes the same settings as flags: keep STREAMLIT_SETTINGS in
# src/missensexplorer/cli.py in step with this file.

[server]
maxUploadSize = 1024

[browser]
gatherUsageStats = false

# Separate light/dark themes keep the automatic (system) switching.
[theme.light]
primaryColor = "#2a78d6"

[theme.dark]
primaryColor = "#3987e5"

[client]
toolbarMode = "minimal"
