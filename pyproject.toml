[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "missensexplorer"
version = "2.5.0"
description = "Predict how DNA variants (VCF, HGVS, rsIDs, 'BRAF V600E') change the encoded human protein."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
  { name = "Briyis Fontecha" }, { name = "Jorge Leyva" }, { name = "Yecid Mina" }, { name = "Juvenal Yosa" },
]
keywords = ["bioinformatics", "variant effect", "missense", "VEP", "AlphaMissense", "VCF", "protein"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pandas>=2.0",
  "openpyxl>=3.1",
  "rich>=13.0",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
gui = ["PySide6>=6.6"]
dev = ["pytest>=8", "pytest-cov>=5", "streamlit>=1.40", "ruff>=0.8", "mypy>=1.13", "pandas-stubs>=2.2", "pre-commit>=3.5"]
benchmark = ["scikit-learn>=1.6", "openpyxl>=3.1"]

[project.scripts]
missensexplorer = "missensexplorer.cli:main"

[project.gui-scripts]
missensexplorer-gui = "missensexplorer.gui:main"

[project.urls]
Homepage = "https://github.com/juvenalyosa/missensexplorer"
Documentation = "https://github.com/juvenalyosa/missensexplorer/tree/main/docs"
Changelog = "https://github.com/juvenalyosa/missensexplorer/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/missensexplorer"]

[tool.hatch.build.targets.sdist]
exclude = ["legacy", ".venv"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["legacy", "build", "packaging"]

[tool.ruff.format]
# generated by the benchmark scripts (pprint); Markdown code examples are laid out by hand
exclude = ["src/missensexplorer/*_params.py", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # import order
  "B",        # bugbear
  "UP",       # pyupgrade
  "SIM",      # simplify
  "C4",       # comprehensions
  "PIE", "RET", "RUF",
  "PT",       # pytest style
  "ANN",      # type annotations
  "D",        # docstrings (Google style)
]
ignore = [
  "ANN401",   # Any is sometimes the honest type (JSON from web APIs)
  "D105",     # magic methods
  "D107",     # __init__: the class docstring documents construction
  "RUF001", "RUF002", "RUF003",  # Unicode (Greek letters, ≥, ★) is intentional in scientific text
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"benchmarks/**" = ["ANN", "D101", "D102", "D103", "D107"]
"src/missensexplorer/*_params.py" = ["E501"]  # generated
"streamlit_app.py" = ["D"]

[tool.ruff.lint.isort]
known-first-party = ["missensexplorer"]

[tool.mypy]
# 3.12: numpy 2.x's stubs use the `type` statement. 3.10 compatibility is checked by ruff
# (target-version) and by the CI test matrix.
python_version = "3.12"
files = ["src/missensexplorer"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = false
strict_equality = true

[[tool.mypy.overrides]]
module = ["streamlit.*", "sklearn.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["missensexplorer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call the public Ensembl/UniProt/AlphaFold APIs"]
addopts = "-m 'not network'"
